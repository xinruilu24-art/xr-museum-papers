<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Research Library</title>
<script>
  // The collection's homepage is the XR Women Research Library; this site only reads single papers.
  if (!new URLSearchParams(location.search).get('p')) location.replace('https://abbyabbyzzz.github.io/xr-women-library/');
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000000'/%3E%3Cpath d='M8 9h7v14H8zM17 9h7v14h-7z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking scripts; app.js shows a view once the font is ready (or after 500 ms). -->
<link id="font-css" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<script src="data/papers.js"></script>
<script>
  // A link to a paper hosted here starts fetching its cover and PDF.js while the page loads.
  // Keep the PDF.js URL in step with assets/pdf-pages.js.
  (() => {
    const id = new URLSearchParams(location.search).get('p');
    if (!window.MUSEUM?.papers?.find(paper => paper.id === id)?.pdf) return;
    const hint = (rel, href, extra) => document.head.append(Object.assign(document.createElement('link'), {rel, href}, extra));
    hint('preload', `covers/${id}.webp`, {as: 'image'});
    hint('preconnect', 'https://cdn.jsdelivr.net', {crossOrigin: 'anonymous'});
    hint('modulepreload', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs', {crossOrigin: 'anonymous'});
  })();
</script>
<link rel="stylesheet" href="assets/site.css">
<link rel="modulepreload" href="assets/flipbook.js">
<link rel="modulepreload" href="assets/pdf-pages.js">
<link rel="modulepreload" href="assets/read-mode.js">
<script type="module" src="assets/app.js"></script>
</head>
<body>
<noscript><p class="noscript">The Research Library needs JavaScript to show papers.</p></noscript>

<div id="notice" class="notice" hidden>
  <h1 class="notice-title"></h1>
  <p class="notice-text"></p>
  <a class="notice-link" href="https://abbyabbyzzz.github.io/xr-women-library/">Browse the Research Library</a>
</div>

<div id="reader" class="reader" hidden>
  <header class="toolbar">
    <div class="paper-heading">
      <h1 class="paper-title"></h1>
      <p class="paper-meta"></p>
    </div>
    <nav class="actions" aria-label="Paper links">
      <a class="icon-button" data-download href="#" aria-label="Download PDF" title="Download PDF" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>
      </a>
      <a class="icon-button" data-doi href="#" target="_blank" rel="noopener" aria-label="Open the article’s DOI page (opens in a new tab)" title="DOI" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.6 13.4a3.6 3.6 0 0 0 5.1 0l3-3a3.6 3.6 0 0 0-5.1-5.1l-1.3 1.3M13.4 10.6a3.6 3.6 0 0 0-5.1 0l-3 3a3.6 3.6 0 0 0 5.1 5.1l1.3-1.3"/></svg>
      </a>
      <a class="icon-button" data-collection href="https://abbyabbyzzz.github.io/xr-women-library/" target="_blank" rel="noopener" aria-label="View all papers in the XR Women Research Library (opens in a new tab)" title="View all papers">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4.5" y="4.5" width="6" height="6" rx="1"/><rect x="13.5" y="4.5" width="6" height="6" rx="1"/><rect x="4.5" y="13.5" width="6" height="6" rx="1"/><rect x="13.5" y="13.5" width="6" height="6" rx="1"/></svg>
      </a>
    </nav>
  </header>

  <main class="stage">
    <div class="book"></div>
    <div class="stage-error" role="alert" hidden>
      <p>This paper can’t be shown here right now.</p>
      <a href="#" target="_blank" rel="noopener">Open the original article</a>
    </div>
    <div class="tp-frame" hidden>
      <article class="title-page" aria-labelledby="tp-title">
        <p class="tp-theme"></p>
        <h2 class="tp-title" id="tp-title"></h2>
        <p class="tp-authors"></p>
        <p class="tp-venue"></p>
        <a class="tp-link" href="#" target="_blank" rel="noopener"><span class="tp-link-label"></span><span class="visually-hidden"> (opens in a new tab)</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
        <p class="tp-license"></p>
        <div class="tp-abstract"></div>
      </article>
    </div>
  </main>

  <footer class="reader-footer">
    <div class="zoom" role="group" aria-label="Page size">
      <button type="button" class="icon-button" data-book-zoom-out aria-label="Make pages smaller" title="Smaller" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 12h12"/></svg>
      </button>
      <output class="zoom-level" aria-live="polite">Fit</output>
      <button type="button" class="icon-button" data-book-zoom-in aria-label="Make pages bigger" title="Bigger">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 12h12M12 6v12"/></svg>
      </button>
    </div>
    <div class="pager">
      <button type="button" class="icon-button" data-previous aria-label="Previous page" title="Previous page" aria-disabled="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <output class="counter" aria-live="polite" aria-atomic="true"></output>
      <button type="button" class="icon-button" data-next aria-label="Next page" title="Next page" aria-disabled="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
      </button>
      <button type="button" class="icon-button" data-read aria-haspopup="dialog" aria-label="Zoom in to read" title="Zoom in to read" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M8 10.5h5M10.5 8v5"/></svg>
      </button>
    </div>
    <button type="button" class="back-button" data-back>Back to FRAME</button>
  </footer>

  <dialog class="read-mode" aria-label="Read mode">
    <div class="rm-bar">
      <p class="rm-position"><span class="rm-position-label">Page</span> <output class="rm-indicator" aria-live="polite" aria-atomic="true"></output></p>
      <div class="rm-zoom-controls">
        <button type="button" class="icon-button" data-zoom-out aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 12h12"/></svg>
        </button>
        <output class="rm-zoom" aria-live="polite">Fit</output>
        <button type="button" class="icon-button" data-zoom-in aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 12h12M12 6v12"/></svg>
        </button>
      </div>
      <div class="rm-actions">
        <button type="button" class="icon-button" data-read-close aria-label="Close read mode" title="Close read mode">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="rm-scroll" tabindex="0" role="region" aria-label="Pages">
      <div class="rm-column"></div>
    </div>
  </dialog>

  <div class="toast" role="status" aria-live="polite"></div>
</div>
</body>
</html>
