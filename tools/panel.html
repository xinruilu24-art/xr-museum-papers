<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Abstract panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<link rel="stylesheet" href="panels.css">
</head>
<body class="size-panel">
<main class="card panel">
  <div class="band"></div>
  <header class="head">
    <span class="chip text" data-slot="theme"></span>
    <span class="read text">Read<span class="badge"><i data-icon="arrow"></i></span></span>
  </header>
  <h1 class="title" data-slot="title"></h1>
  <p class="authors text" data-slot="authors"></p>
  <p class="venue text" data-slot="venue"></p>
  <div class="rule"></div>
  <h2 class="label text">Abstract</h2>
  <div class="abstract text" data-slot="abstract"></div>
  <footer class="foot">
    <p class="cue text"><i data-icon="pointer"></i>Click this panel to read the full paper</p>
    <p class="meta text" data-slot="meta"></p>
  </footer>
</main>
<script src="../data/papers.js"></script>
<script src="panels.js"></script>
<script>Panels.panel();</script>
</body>
</html>
